name: Refresh Anki decks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh deck catalog
        env:
          ANKIWEB_EMAIL: ${{ secrets.ANKIWEB_EMAIL }}
          ANKIWEB_PASSWORD: ${{ secrets.ANKIWEB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIAPP_URL: ${{ vars.MINIAPP_URL }}
          RUNTIME_BACKEND: control_api
          CONTROL_API_URL: ${{ secrets.CONTROL_API_URL }}
          CONTROL_API_TOKEN: ${{ secrets.CONTROL_API_TOKEN }}
        run: PYTHONPATH=src python -m anki_reminder_bot.entrypoints.deck_sync_job
