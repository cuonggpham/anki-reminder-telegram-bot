name: Anki reminder

on:
  schedule:
    # The job wakes up every five minutes and the application decides whether
    # a user-configured local-time slot is due.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-state
  cancel-in-progress: false

jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run reminder job
        env:
          ANKIWEB_EMAIL: ${{ secrets.ANKIWEB_EMAIL }}
          ANKIWEB_PASSWORD: ${{ secrets.ANKIWEB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIAPP_URL: ${{ vars.MINIAPP_URL }}
          RUNTIME_BACKEND: control_api
          CONTROL_API_URL: ${{ secrets.CONTROL_API_URL }}
          CONTROL_API_TOKEN: ${{ secrets.CONTROL_API_TOKEN }}
          RUNTIME_DIR: runtime
        run: PYTHONPATH=src python -m anki_reminder_bot.entrypoints.reminder_job
