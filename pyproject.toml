[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-telegram-reminder-bot"
version = "0.1.0"
description = "A single-user AnkiWeb reminder bot for Telegram"
requires-python = ">=3.12"
dependencies = [
    "anki==26.8.1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
