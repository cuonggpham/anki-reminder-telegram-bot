<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Study Now</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
      main { width: min(92vw, 420px); text-align: center; padding: 32px 20px; }
      button { border: 0; border-radius: 12px; padding: 14px 20px; font-size: 16px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
      p { color: var(--tg-theme-hint-color, #777); line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>📖 Study Now</h1>
      <p>Opening AnkiWeb / Đang mở AnkiWeb…</p>
      <button id="open">Open AnkiWeb</button>
    </main>
    <script>
      const tg = window.Telegram?.WebApp;
      tg?.ready();
      tg?.expand();
      if (typeof tg?.requestFullscreen === "function") tg.requestFullscreen();
      const target = "https://ankiweb.net/";
      document.getElementById("open").addEventListener("click", () => { window.location.href = target; });
      window.setTimeout(() => { window.location.href = target; }, 350);
    </script>
  </body>
</html>
